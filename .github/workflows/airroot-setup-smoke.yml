name: AIRoot setup smoke

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

jobs:
  setup-smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          set -euo pipefail
          uname -a || true
          bash --version
          git --version
          if command -v python3 >/dev/null 2>&1; then python3 --version; fi
          if command -v python >/dev/null 2>&1; then python --version; fi

      - name: Run AIRoot setup smoke
        run: bash scripts/testing/run_setup_smoke.sh
