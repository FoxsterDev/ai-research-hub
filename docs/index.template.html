  <style>
    :root {
      --paper: #f6f0e7;
      --paper-strong: #fffaf3;
      --ink: #152531;
      --ink-soft: #415462;
      --line: rgba(21, 37, 49, 0.14);
      --accent: #ca5538;
      --accent-deep: #97371d;
      --accent-soft: #f0c4ae;
      --teal: #2f7c84;
      --teal-soft: #d8eeef;
      --olive: #71855f;
      --gold: #d9b561;
      --gold-soft: #f4e2aa;
      --shadow: 0 24px 60px rgba(31, 42, 52, 0.12);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --site-width: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(120deg, rgba(217, 181, 97, 0.07), transparent 24%),
        radial-gradient(circle at top left, rgba(202, 85, 56, 0.16), transparent 28%),
        radial-gradient(circle at top right, rgba(47, 124, 132, 0.14), transparent 24%),
        linear-gradient(180deg, #fcf7f0 0%, #f4ede3 100%);
      font-family: "Trebuchet MS", "Gill Sans", "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(21, 37, 49, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(21, 37, 49, 0.015) 1px, transparent 1px);
      background-size: 26px 26px;
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.28), transparent 70%);
      opacity: 0.3;
    }

    a {
      color: inherit;
    }

    img {
      display: block;
      max-width: 100%;
    }

    code {
      padding: 0.14em 0.42em;
      border-radius: 0.5em;
      background: rgba(21, 37, 49, 0.06);
      color: var(--accent-deep);
      font-family: "SFMono-Regular", "Consolas", "Liberation Mono", monospace;
      font-size: 0.92em;
    }

    .shell {
      width: min(var(--site-width), calc(100vw - 32px));
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(16px);
      background: rgba(246, 240, 231, 0.82);
      border-bottom: 1px solid rgba(21, 37, 49, 0.08);
      box-shadow: inset 0 1px 0 rgba(255, 250, 243, 0.62);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 7px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: var(--paper-strong);
      background: linear-gradient(135deg, var(--accent) 0%, var(--teal) 100%);
      box-shadow: 0 12px 28px rgba(47, 124, 132, 0.24);
      font-weight: 700;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
    }

    .brand-copy strong,
    .hero-copy h1,
    .section-title h2,
    .card h3,
    .step h3,
    .rule h3 {
      font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
      letter-spacing: -0.02em;
    }

    .brand-copy {
      line-height: 1.1;
    }

    .brand-copy strong {
      display: block;
      font-size: 0.96rem;
    }

    .brand-copy span {
      display: block;
      color: var(--ink-soft);
      font-size: 0.78rem;
    }

    .topnav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .topnav a,
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid rgba(21, 37, 49, 0.1);
      text-decoration: none;
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
    }

    .topnav a:hover,
    .button:hover {
      transform: translateY(-1px);
      border-color: rgba(21, 37, 49, 0.22);
    }

    .topnav a {
      min-height: 28px;
      padding: 0 11px;
      font-size: 0.84rem;
      background: rgba(255, 250, 243, 0.72);
    }

    .button.primary {
      color: var(--paper-strong);
      border-color: transparent;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
      box-shadow: 0 16px 36px rgba(151, 55, 29, 0.2);
    }

    .button.secondary {
      background: rgba(255, 250, 243, 0.84);
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 28px 0 18px;
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      filter: blur(1px);
      opacity: 0.9;
      animation: drift 10s ease-in-out infinite;
      pointer-events: none;
    }

    .hero::before {
      width: 320px;
      height: 320px;
      top: -120px;
      right: -60px;
      background: radial-gradient(circle, rgba(202, 85, 56, 0.26), transparent 64%);
    }

    .hero::after {
      width: 280px;
      height: 280px;
      left: -90px;
      bottom: 20px;
      background: radial-gradient(circle, rgba(47, 124, 132, 0.24), transparent 66%);
      animation-delay: -3s;
    }

    .hero-grid {
      display: grid;
      gap: 28px;
      grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr);
      align-items: start;
    }

    .hero-copy h1 {
      margin: 0 0 12px;
      font-size: clamp(2.3rem, 4vw, 4rem);
      line-height: 0.9;
    }

    .hero-copy p {
      max-width: 62ch;
      margin: 0 0 16px;
      font-size: 1rem;
      color: var(--ink-soft);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .signature-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0 0;
    }

    .signature-pill {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(255, 250, 243, 0.82);
      border: 1px solid rgba(21, 37, 49, 0.1);
      color: var(--ink);
      font-size: 0.84rem;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.62);
    }

    .hero-author .signature-strip {
      margin-top: 12px;
    }

    .hero-author .signature-pill {
      min-height: 30px;
      background: rgba(255, 250, 243, 0.1);
      border-color: rgba(255, 225, 141, 0.16);
      color: rgba(255, 242, 212, 0.88);
      font-size: 0.78rem;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .hero-summary-grid {
      display: grid;
      gap: 12px;
      margin-top: 16px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .hero-summary-card {
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(255, 250, 243, 0.78);
      border: 1px solid rgba(21, 37, 49, 0.08);
    }

    .hero-summary-card strong {
      display: block;
      margin-bottom: 5px;
      font-size: 0.96rem;
    }

    .hero-summary-card span {
      color: var(--ink-soft);
      font-size: 0.9rem;
    }

    .hero-panel {
      position: relative;
      display: grid;
      gap: 14px;
      background: linear-gradient(180deg, rgba(255, 250, 243, 0.94), rgba(255, 245, 235, 0.88));
      border: 1px solid rgba(21, 37, 49, 0.08);
      border-radius: var(--radius-xl);
      padding: 18px;
      box-shadow: var(--shadow);
      animation: rise 680ms ease both;
    }

    .hero-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(217, 181, 97, 0.26), rgba(47, 124, 132, 0.18), rgba(21, 37, 49, 0.08));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .hero-author {
      padding: 16px;
      border-radius: 22px;
      color: var(--paper-strong);
      background:
        linear-gradient(135deg, rgba(21, 37, 49, 0.98), rgba(47, 124, 132, 0.94)),
        linear-gradient(180deg, #13212b, #0f1a22);
      box-shadow: 0 18px 36px rgba(31, 42, 52, 0.14);
    }

    .author-badge {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(255, 241, 198, 0.2), rgba(255, 250, 243, 0.08));
      border: 1px solid rgba(255, 225, 141, 0.22);
      color: rgba(255, 242, 212, 0.96);
      font-size: 0.86rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .author-kicker {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      margin-top: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 226, 140, 0.26);
      background:
        linear-gradient(135deg, rgba(255, 235, 170, 0.18), rgba(255, 250, 243, 0.08)),
        rgba(255, 250, 243, 0.08);
      color: rgba(255, 243, 214, 0.96);
      box-shadow:
        inset 0 1px 0 rgba(255, 248, 225, 0.18),
        0 8px 18px rgba(196, 142, 32, 0.08);
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .hero-author h3 {
      margin: 10px 0 8px;
      font-size: clamp(1.25rem, 2vw, 1.7rem);
      font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
      letter-spacing: -0.02em;
    }

    .hero-author p {
      margin: 0;
      color: rgba(255, 250, 243, 0.82);
      font-size: 0.9rem;
    }

    .author-proof-grid {
      display: grid;
      gap: 8px;
      margin-top: 12px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .author-proof {
      padding: 12px;
      border-radius: 16px;
      background: rgba(255, 250, 243, 0.1);
      border: 1px solid rgba(255, 250, 243, 0.14);
    }

    .author-proof.featured {
      background:
        linear-gradient(135deg, rgba(255, 222, 128, 0.34), rgba(232, 178, 58, 0.26)),
        linear-gradient(180deg, rgba(255, 247, 220, 0.2), rgba(255, 214, 102, 0.12));
      border-color: rgba(255, 226, 140, 0.34);
      box-shadow:
        inset 0 1px 0 rgba(255, 249, 232, 0.28),
        0 8px 18px rgba(196, 142, 32, 0.16);
    }

    .author-proof.featured strong,
    .author-proof.featured span,
    .author-proof.featured a {
      color: #fff4d9;
    }

    .author-proof strong {
      display: block;
      margin-bottom: 4px;
      font-size: 0.95rem;
      font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
      letter-spacing: -0.02em;
    }

    .author-proof span {
      color: rgba(255, 250, 243, 0.8);
      font-size: 0.82rem;
    }

    .hero-questions {
      padding: 16px;
      border-radius: 22px;
      background: rgba(255, 250, 243, 0.9);
      border: 1px solid rgba(21, 37, 49, 0.08);
    }

    .hero-questions h3 {
      margin: 0 0 10px;
      font-size: clamp(1.3rem, 2.1vw, 1.7rem);
      font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
      letter-spacing: -0.02em;
    }

    .hero-questions .founder-list {
      gap: 10px;
    }

    .founder-decision-band {
      padding-top: 0;
    }

    .founder-decision-shell {
      display: grid;
      gap: 18px;
      grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
      align-items: start;
      padding: 22px;
      border-radius: var(--radius-xl);
      background: rgba(255, 250, 243, 0.82);
      border: 1px solid rgba(21, 37, 49, 0.08);
      box-shadow: 0 18px 36px rgba(31, 42, 52, 0.06);
    }

    .founder-decision-copy {
      display: grid;
      gap: 10px;
    }

    .founder-decision-copy h2 {
      margin: 0;
      font-size: clamp(1.7rem, 3vw, 2.4rem);
      line-height: 0.98;
      font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
      letter-spacing: -0.02em;
    }

    .founder-decision-copy p {
      margin: 0;
      color: var(--ink-soft);
      max-width: 52ch;
    }

    .author-proof a {
      color: var(--paper-strong);
      text-decoration: underline;
      text-decoration-color: rgba(255, 250, 243, 0.34);
      text-underline-offset: 0.16em;
    }

    .panel-note {
      display: grid;
      gap: 14px;
      margin-top: 18px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .panel-pill {
      padding: 14px;
      border-radius: 18px;
      background: rgba(246, 240, 231, 0.72);
      border: 1px solid rgba(21, 37, 49, 0.08);
    }

    .panel-pill strong {
      display: block;
      margin-bottom: 4px;
      font-size: 0.92rem;
    }

    .panel-pill span {
      color: var(--ink-soft);
      font-size: 0.9rem;
    }

    .decision-panel {
      display: grid;
      gap: 14px;
    }

    .decision-kicker {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(202, 85, 56, 0.1);
      color: var(--accent-deep);
      font-size: 0.86rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .decision-panel h3 {
      margin: 0;
      font-size: clamp(1.55rem, 2.5vw, 2.2rem);
      font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
      letter-spacing: -0.02em;
    }

    .decision-panel > p {
      margin: 0;
      color: var(--ink-soft);
    }

    .decision-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .decision-card {
      padding: 16px;
      border-radius: 18px;
      border: 1px solid rgba(21, 37, 49, 0.08);
      background: linear-gradient(180deg, rgba(255, 250, 243, 0.92), rgba(246, 240, 231, 0.76));
    }

    .decision-card strong {
      display: block;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    .decision-card span {
      color: var(--ink-soft);
      font-size: 0.92rem;
    }

    .decision-card.risk {
      background: linear-gradient(180deg, rgba(201, 85, 56, 0.14), rgba(255, 250, 243, 0.9));
    }

    .decision-card.validation {
      background: linear-gradient(180deg, rgba(47, 124, 132, 0.14), rgba(255, 250, 243, 0.9));
    }

    .decision-card.safe {
      background: linear-gradient(180deg, rgba(113, 133, 95, 0.14), rgba(255, 250, 243, 0.9));
    }

    .decision-card.gap {
      background: linear-gradient(180deg, rgba(21, 37, 49, 0.08), rgba(255, 250, 243, 0.9));
    }

    main section {
      padding: 28px 0 18px;
    }

    .section-title {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 22px;
    }

    .section-title h2 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.2rem);
      line-height: 0.96;
    }

    .section-title p {
      max-width: 58ch;
      margin: 0;
      color: var(--ink-soft);
    }

    .founder-spotlight {
      display: grid;
      gap: 22px;
      grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr);
      align-items: stretch;
    }

    .founder-main,
    .founder-side {
      padding: 24px;
      border-radius: var(--radius-xl);
      border: 1px solid rgba(21, 37, 49, 0.08);
      box-shadow: var(--shadow);
    }

    .founder-main {
      color: var(--paper-strong);
      background:
        linear-gradient(135deg, rgba(21, 37, 49, 0.98), rgba(47, 124, 132, 0.96)),
        linear-gradient(180deg, #13212b, #0f1a22);
    }

    .founder-main p {
      margin: 0;
      color: rgba(255, 250, 243, 0.82);
    }

    .founder-main h3,
    .founder-side h3,
    .founder-metric strong {
      font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
      letter-spacing: -0.02em;
    }

    .founder-main h3,
    .founder-side h3 {
      margin: 0 0 12px;
      font-size: clamp(1.7rem, 3vw, 2.4rem);
    }

    .founder-main .audience-links {
      margin-top: 18px;
    }

    .founder-main .audience-links a {
      background: rgba(255, 250, 243, 0.12);
      border-color: rgba(255, 250, 243, 0.22);
      color: var(--paper-strong);
    }

    .founder-metrics {
      display: grid;
      gap: 12px;
      margin-top: 18px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .founder-metric {
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(255, 250, 243, 0.1);
      border: 1px solid rgba(255, 250, 243, 0.14);
    }

    .founder-metric strong {
      display: block;
      margin-bottom: 4px;
      font-size: 1rem;
    }

    .founder-metric span {
      font-size: 0.9rem;
      color: rgba(255, 250, 243, 0.8);
    }

    .founder-side {
      background: rgba(255, 250, 243, 0.88);
    }

    .founder-list {
      display: grid;
      gap: 14px;
    }

    .founder-list-item {
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(246, 240, 231, 0.78);
      border: 1px solid rgba(21, 37, 49, 0.08);
    }

    .founder-list-item strong {
      display: block;
      margin-bottom: 4px;
      font-size: 0.96rem;
    }

    .founder-list-item span {
      color: var(--ink-soft);
      font-size: 0.92rem;
    }

    .grid {
      display: grid;
      gap: 18px;
    }

    .grid.cards-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .grid.cards-3-soft {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .grid.cards-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .card {
      position: relative;
      overflow: hidden;
      min-height: 220px;
      padding: 22px;
      border-radius: var(--radius-lg);
      background: rgba(255, 250, 243, 0.82);
      border: 1px solid rgba(21, 37, 49, 0.08);
      box-shadow: 0 18px 36px rgba(31, 42, 52, 0.06);
      animation: rise 780ms ease both;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: auto -28px -28px auto;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(202, 85, 56, 0.14), transparent 68%);
      pointer-events: none;
    }

    .card h3,
    .step h3,
    .rule h3 {
      margin: 0 0 10px;
      font-size: 1.34rem;
    }

    .card p,
    .step p,
    .rule p,
    .architecture-copy p,
    .banner p,
    footer p {
      margin: 0;
      color: var(--ink-soft);
    }

    .card a {
      display: inline-flex;
      margin-top: 16px;
      align-items: center;
      gap: 10px;
      color: var(--accent-deep);
      text-decoration: none;
      font-weight: 700;
    }

    .card.compact {
      min-height: 0;
      padding: 20px;
    }

    .card.compact p {
      max-width: 46ch;
    }

    .architecture {
      display: grid;
      gap: 22px;
      grid-template-columns: minmax(0, 1.06fr) minmax(0, 0.94fr);
      align-items: center;
    }

    .architecture-visual,
    .architecture-copy,
    .banner {
      padding: 22px;
      border-radius: var(--radius-xl);
      background: rgba(255, 250, 243, 0.84);
      border: 1px solid rgba(21, 37, 49, 0.08);
      box-shadow: var(--shadow);
    }

    .stack-list {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .rule {
      padding: 16px 18px;
      border-radius: var(--radius-md);
      background: linear-gradient(180deg, rgba(246, 240, 231, 0.86), rgba(255, 250, 243, 0.8));
      border: 1px solid rgba(21, 37, 49, 0.08);
    }

    .rule h3 {
      font-size: 1.08rem;
      margin-bottom: 6px;
    }

    .steps {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .use-case-grid {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .role-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 18px;
    }

    .role-button {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid rgba(21, 37, 49, 0.1);
      background: rgba(255, 250, 243, 0.88);
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
    }

    .role-button:hover {
      transform: translateY(-1px);
      border-color: rgba(21, 37, 49, 0.22);
    }

    .role-button[aria-pressed="true"] {
      color: var(--paper-strong);
      border-color: transparent;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
      box-shadow: 0 16px 36px rgba(151, 55, 29, 0.16);
    }

    .role-panel {
      display: none;
    }

    .role-panel.active {
      display: block;
    }

    .role-lead {
      margin: 0 0 18px;
      color: var(--ink-soft);
      max-width: 64ch;
    }

    .conversion-grid {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .conversion-card {
      padding: 22px;
      border-radius: var(--radius-lg);
      background: rgba(255, 250, 243, 0.86);
      border: 1px solid rgba(21, 37, 49, 0.08);
      box-shadow: 0 18px 36px rgba(31, 42, 52, 0.06);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.62),
        0 18px 36px rgba(31, 42, 52, 0.06);
    }

    .conversion-card strong {
      display: inline-flex;
      margin-bottom: 12px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(47, 124, 132, 0.1);
      color: var(--teal);
      font-size: 0.88rem;
    }

    .conversion-card h3 {
      margin: 0 0 10px;
      font-size: 1.34rem;
      font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
      letter-spacing: -0.02em;
    }

    .conversion-card p {
      margin: 0 0 12px;
      color: var(--ink-soft);
    }

    .conversion-steps {
      display: grid;
      gap: 8px;
      margin: 14px 0 0;
      padding: 0;
      list-style: none;
      color: var(--ink-soft);
      font-size: 0.92rem;
    }

    .conversion-steps li::before {
      content: "→ ";
      color: var(--accent-deep);
      font-weight: 700;
    }

    .conversion-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .conversion-actions a {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid rgba(21, 37, 49, 0.1);
      background: rgba(255, 250, 243, 0.92);
      text-decoration: none;
      font-size: 0.92rem;
      color: var(--ink);
    }

    .command-stack {
      display: grid;
      gap: 8px;
      margin-top: 16px;
    }

    .command-stack code {
      display: inline-flex;
      width: fit-content;
      padding: 9px 12px;
      border-radius: 14px;
      background: rgba(21, 37, 49, 0.06);
      color: var(--accent-deep);
      font-size: 0.88rem;
    }

    .consulting-grid {
      display: grid;
      gap: 18px;
      grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr);
    }

    .consulting-panel {
      padding: 22px;
      border-radius: var(--radius-xl);
      border: 1px solid rgba(21, 37, 49, 0.08);
      box-shadow: var(--shadow);
    }

    .consulting-panel.primary {
      color: var(--paper-strong);
      background:
        linear-gradient(135deg, rgba(21, 37, 49, 0.98), rgba(202, 85, 56, 0.92)),
        linear-gradient(180deg, #13212b, #0f1a22);
    }

    .consulting-panel.secondary {
      background: rgba(255, 250, 243, 0.88);
    }

    .consulting-panel strong {
      display: inline-flex;
      margin-bottom: 12px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 250, 243, 0.12);
      color: var(--paper-strong);
      font-size: 0.88rem;
    }

    .consulting-panel.secondary strong {
      background: rgba(47, 124, 132, 0.1);
      color: var(--teal);
    }

    .consulting-panel h3 {
      margin: 0 0 10px;
      font-size: 1.5rem;
      font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
      letter-spacing: -0.02em;
    }

    .author-method {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      margin: 0 0 12px;
      padding: 7px 11px;
      border-radius: 999px;
      border: 1px solid rgba(255, 225, 141, 0.18);
      background: rgba(255, 250, 243, 0.08);
      color: rgba(255, 242, 212, 0.9);
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .consulting-panel p {
      margin: 0;
      color: inherit;
    }

    .consulting-panel.primary p,
    .consulting-panel.primary li {
      color: rgba(255, 250, 243, 0.82);
    }

    .fit-list {
      display: grid;
      gap: 10px;
      margin: 16px 0 0;
      padding: 0;
      list-style: none;
    }

    .fit-list li {
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255, 250, 243, 0.1);
      border: 1px solid rgba(255, 250, 243, 0.14);
    }

    .consulting-panel.secondary .fit-list li {
      background: rgba(246, 240, 231, 0.78);
      border-color: rgba(21, 37, 49, 0.08);
      color: var(--ink-soft);
    }

    .consulting-panel .audience-links {
      margin-top: 18px;
    }

    .audience-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .audience-links a {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid rgba(21, 37, 49, 0.1);
      background: rgba(255, 250, 243, 0.88);
      text-decoration: none;
      font-size: 0.92rem;
      color: var(--ink);
    }

    .use-case {
      padding: 22px;
      border-radius: var(--radius-lg);
      background: rgba(255, 250, 243, 0.82);
      border: 1px solid rgba(21, 37, 49, 0.08);
      box-shadow: 0 18px 36px rgba(31, 42, 52, 0.06);
    }

    .use-case strong {
      display: inline-flex;
      margin-bottom: 12px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(47, 124, 132, 0.1);
      color: var(--teal);
      font-size: 0.88rem;
    }

    .use-case h3 {
      margin: 0 0 10px;
      font-size: 1.3rem;
      font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
      letter-spacing: -0.02em;
    }

    .use-case p {
      margin: 0 0 12px;
      color: var(--ink-soft);
    }

    .use-case code {
      font-size: 0.9rem;
      color: var(--accent-deep);
    }

    .step {
      position: relative;
      padding: 22px;
      border-radius: var(--radius-lg);
      background: rgba(255, 250, 243, 0.78);
      border: 1px solid rgba(21, 37, 49, 0.08);
    }

    .step-number {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      margin-bottom: 14px;
      border-radius: 50%;
      color: var(--paper-strong);
      font-weight: 700;
      background: linear-gradient(135deg, var(--teal) 0%, var(--olive) 100%);
      box-shadow: 0 12px 24px rgba(47, 124, 132, 0.22);
    }

    .banner {
      display: grid;
      gap: 12px;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      margin-top: 24px;
      background:
        linear-gradient(135deg, rgba(21, 37, 49, 0.96), rgba(47, 124, 132, 0.94)),
        linear-gradient(180deg, #13212b, #0f1a22);
      color: var(--paper-strong);
    }

    .banner p {
      color: rgba(255, 250, 243, 0.82);
    }

    .banner .button.secondary {
      background: rgba(255, 250, 243, 0.12);
      border-color: rgba(255, 250, 243, 0.2);
      color: var(--paper-strong);
    }

    footer {
      padding: 22px 0 46px;
    }

    footer .shell {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-top: 20px;
      border-top: 1px solid rgba(21, 37, 49, 0.08);
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .footer-links a {
      color: var(--ink-soft);
      text-decoration: none;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes drift {
      0%, 100% {
        transform: translate3d(0, 0, 0);
      }
      50% {
        transform: translate3d(10px, 14px, 0);
      }
    }

    @media (max-width: 1080px) {
      .hero-grid,
      .founder-decision-shell,
      .architecture,
      .founder-spotlight,
      .grid.cards-4,
      .grid.cards-3-soft,
      .grid.cards-3,
      .conversion-grid,
      .consulting-grid,
      .steps,
      .use-case-grid,
      .hero-summary-grid,
      .author-proof-grid,
      .decision-grid,
      .founder-metrics,
      .panel-note {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .hero-grid > :first-child,
      .architecture > :first-child,
      .banner > :first-child {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 720px) {
      .topbar-inner,
      .banner {
        grid-template-columns: 1fr;
      }

      .topbar-inner,
      .hero-grid,
      .founder-decision-shell,
      .architecture,
      .founder-spotlight,
      .grid.cards-4,
      .grid.cards-3-soft,
      .grid.cards-3,
      .conversion-grid,
      .consulting-grid,
      .steps,
      .use-case-grid,
      .hero-summary-grid,
      .author-proof-grid,
      .decision-grid,
      .founder-metrics,
      .panel-note {
        display: grid;
        grid-template-columns: 1fr;
      }

      .topnav {
        gap: 8px;
      }

      .hero {
        padding-top: 34px;
      }

      .hero-copy h1 {
        font-size: clamp(2.4rem, 11vw, 4rem);
      }

      .section-title h2 {
        font-size: clamp(1.8rem, 9vw, 2.7rem);
      }
    }
  </style>
</head>
<body>
{{BODY}}
